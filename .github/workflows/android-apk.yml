name: Android APK (LAN Paylaşım)

# LAN Kamera & Dosya Paylaşımı web uygulamasını Capacitor ile saran
# Android APK'sını derler ve indirilebilir artifact olarak yayınlar.

on:
  push:
    branches: ["**"]
    paths:
      - "lan-camera-share/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lan-camera-share
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Capacitor sync (web -> android)
        run: npx cap sync android

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        working-directory: lan-camera-share/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lan-paylasim-apk
          path: lan-camera-share/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
